name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}

      - name: Compile every Maven project
        # Most projects here are standalone poms with no aggregator, so CodeQL's generic
        # autobuilder won't find them all - compile each one explicitly instead. But
        # social-publisher-mcp *is* a multi-module reactor, and compiling one of its
        # submodules on its own fails because it can't resolve a sibling module that
        # hasn't been built yet. Same root-detection logic as build.yml: only compile a
        # directory if no ancestor directory also has a pom.xml, so a reactor gets built
        # once through its parent instead of module-by-module.
        run: |
          all=$(find . -name pom.xml -not -path '*/target/*' -exec dirname {} \; | sed 's#^\./##' | sort -u)
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            parent=$(dirname "$dir")
            is_child=false
            while [ "$parent" != "." ]; do
              if printf '%s\n' "$all" | grep -qxF "$parent"; then is_child=true; break; fi
              parent=$(dirname "$parent")
            done
            [ "$is_child" = true ] && continue
            echo "Compiling $dir"
            (cd "$dir" && mvn -B -q clean compile)
          done <<< "$all"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: '/language:${{ matrix.language }}'
